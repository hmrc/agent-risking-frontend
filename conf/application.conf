include "frontend.conf"

appName = "agent-risking-frontend"
play.http.router = prod.Routes

play.filters.enabled += play.filters.csp.CSPFilter

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.agentriskingfrontend.config.Module"

# Custom error handler
play.http.errorHandler = "uk.gov.hmrc.agentriskingfrontend.config.ErrorHandler"

microservice {
  services {
    address-lookup-frontend {
      host = localhost
      port = 9028
    }
    agents-external-stubs {
      host = localhost
      port = 9009
    }
    agent-risking-frontend {
      host = localhost
      port = 22204
    }
    agent-risking-backend {
      host = localhost
      port = 22205
    }
    auth {
      host = localhost
      port = 8500
    }
    companies-house-api-proxy {
      host = localhost
      port = 9991
    }
    email-verification {
      host = localhost
      port = 9891
    }
    enrolment-store-proxy {
      host = localhost
      port = 9595
      port = 7775
    }
    object-store {
      host = localhost
      port = 8464
    }
    upscan-initiate {
      host = localhost
      port = 9570
      protocol = http
    }
    citizen-details {
      host = localhost
      port = 9337
    }
    agent-assurance {
      host = localhost
      port = 9565
      protocol = http
    }
  }
}

urls {
  this-frontend = "http://localhost:22204"       # Default value
  this-frontend = ${?platform.frontend.host}     # Overrides default if set

  this-frontend-relative = "http://localhost:22204"       # some services require a full URL others require a relative URL (e.g. email verification)

  email-verification-frontend = "http://localhost:9890"
  email-verification-frontend = ${?platform.frontend.host}

  feedback-frontend = "http://localhost:9514"
  feedback-frontend = ${?platform.frontend.host}

  bas-gateway-base-url = "http://localhost:9099"
  bas-gateway-base-url = ${?platform.frontend.host}
  bas-gateway-sign-in = ${urls.bas-gateway-base-url}"/bas-gateway/sign-in"
  bas-gateway-sign-out = ${urls.bas-gateway-base-url}"/bas-gateway/sign-out-without-state"

  iv-url = "http://localhost:9938"
  iv-url = ${?platform.frontend.host}
  iv-uplift-url = ${urls.iv-url}"/mdtp/uplift"

  asa-fe-base-url = "http://localhost:9401"
  asa-fe-base-url = ${?platform.frontend.host}
  asa-fe-dashboard-url = ${urls.asa-fe-base-url}"/agent-services-account/home"
  
  govuk-definition-of-relevant-individuals = "https://www.legislation.gov.uk/ukpga/2026/11/enacted#section-226"
  govuk-hmrc-standard-for-agents = "https://www.gov.uk/government/publications/hmrc-the-standard-for-agents"
  govuk-guidance-failed-review-and-appeals = "https://www.gov.uk/guidance/if-you-disagree-with-hmrcs-decision-about-your-tax-adviser-registration"
  govuk-guidance-dedicated-helplines-for-authorised-agents = "https://www.gov.uk/guidance/dedicated-helplines-and-contacts-for-authorised-agents"
  govuk-find-lost-utr = "https://www.gov.uk/find-utr-number"
  companies-house="https://beta.companieshouse.gov.uk/"
  contact-hmrc="https://www.gov.uk/contact-hmrc"
}

accessibility-statement.service-path = "/agent-update-information"

play.i18n.langCookieHttpOnly: "true"

# Change this value to true to enable Welsh translations to be loaded from messages.cy, and to display the language toggle
features.welsh-language-support = false

# Replace play.i18n.langs with the commented out line below when your service has been fully translated into Welsh
# to enable Welsh translations for all content, including the standard headers and footers.
# play.i18n.langs = ["en", "cy"]
play.i18n.langs = ["en"]

tracking-consent-frontend {
  gtm.container = "b"
}

contact-frontend.serviceId = "agent-risking"

mongodb {
  uri = "mongodb://localhost:27017/agent-registration-frontend"
  upload-repo-ttl = 1h
}

uploads {
  max-file-size = 6MiB
  check-upload-status-max-attempts = 20
  check-upload-status-interval = 1000 millis
  accept-mime-types = "image/jpeg,image/png,image/tiff,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.oasis.opendocument.presentation"
}

ignoreEmailVerification = false // Set to true to default all new emails to verified (for staging tests only)

# this setting injects test-only email-verification-passcodes page before navigating to the email verification service. The injected page displays email verification codes
inject-email-verification-passcodes-page = true

# we use object store for upload storage and need an internal auth token to use for this
# this token value is only for local development and can be initialised for object-store by running ./setup-object-store.sh
# we may have a need to setup different permissions for this token if we integrate with other services requiring internal auth permissions
internal-auth.token = "1234"
object-store.default-retention-period = 6-months

allowed-redirect-hosts = [
  "localhost",
  "www.gov.uk",
  "www.qa.tax.service.gov.uk",
  "www.staging.tax.service.gov.uk",
  "www.tax.service.gov.uk"
]

auditing {
  enabled = true
}

fieldLevelEncryption {
  enabled = false
  key = "edkOOwt7uvzw1TXnFIN6aRVHkfWcgiOrbBvkEQvO65g="
  previousKeys = []
}

test-only.allow-reset-database = true

play-frontend-hmrc {
    useRebrand = true
}
